name: Build Approval Slip Query System

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'  # 当推送 v 开头的标签时触发，如 v1.0.0, v2.2.4
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write  # 允许创建 Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        cache: false
        py7zrversion: '==1.1.0'

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup MSVC Dev Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }}"

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Collect Dependencies
      run: |
        cd build/bin/Release
        & "${{ env.Qt5_DIR }}/bin/windeployqt.exe" --release ApprovalSlipQueryServer.exe

    - name: Package Release
      run: |
        mkdir ApprovalSlipQuerySystem-Release

        # 复制服务器（仅服务器，无客户端）
        Copy-Item build/bin/Release/ApprovalSlipQueryServer.exe ApprovalSlipQuerySystem-Release/
        Copy-Item build/bin/Release/*.dll ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/*.py ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/*.lic ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/模板.docx ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/文件批办单.html ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/h2.jar ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/platforms ApprovalSlipQuerySystem-Release/ -Recurse -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/styles ApprovalSlipQuerySystem-Release/ -Recurse -ErrorAction SilentlyContinue
        Copy-Item build/bin/Release/plugins ApprovalSlipQuerySystem-Release/ -Recurse -ErrorAction SilentlyContinue

        # 复制文档
        Copy-Item README.md ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item QUICKSTART.md ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue
        Copy-Item BUILD.md ApprovalSlipQuerySystem-Release/ -ErrorAction SilentlyContinue

        # 创建压缩包
        Compress-Archive -Path ApprovalSlipQuerySystem-Release/* -DestinationPath ApprovalSlipQuerySystem-Windows-x64.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ApprovalSlipQuerySystem-Windows-x64
        path: ApprovalSlipQuerySystem-Windows-x64.zip
        retention-days: 30

    - name: Upload Server Executable
      uses: actions/upload-artifact@v4
      with:
        name: ApprovalSlipQueryServer
        path: ApprovalSlipQuerySystem-Release/
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ApprovalSlipQuerySystem-Windows-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
