<!--
  ============================================================================
  由「模板.docx」1:1 转换而来（尺寸全部来自 docx 原始度量，非目测）

  页面     : A4 21cm × 29.7cm            (pgSz 11906 × 16838 twips)
  页边距   : 上下 2.54cm / 左右 3.175cm   (pgMar 1440 / 1800 twips)
  表格总宽 : 16.906875cm                 (tblW 9585 dxa，比版心宽 2.256cm，
                                          按 Word 的 tbl jc=center 左右均分溢出)
  表格边框 : 1pt 实线 #FF0000             (tblBorders sz=8)
  正文字体 : 仿宋_GB2312 14pt             (sz=28 半磅)
  标题字体 : 方正小标宋简体 22pt           (sz=44 半磅)

  【字体与颜色（与 docx 完全一致，可自行核对）】
    标题     : 方正小标宋简体 22pt #FF0000   (sz=44 半磅, color FF0000)
    表格标签 : 仿宋_GB2312 14pt #FF0000       (来文单位/来文字号/… 左侧红字)
    填写内容 : 仿宋_GB2312 14pt #000000       (docx 未设 color → 默认黑)
    表格线   : 1pt 实线 #FF0000               (tblBorders sz=8)
    表尾备注 : 仿宋_GB2312 14pt #FF0000，强制单行

  【行高：全部集中在 :root 变量里，不用动 HTML】
    --rh        前 4 行（来文单位 / 来文字号 / 来文类型 / 紧急程度）
    --rh-biaoti 文件标题    --rh-pishi 领导批示    --rh-niban 拟办意见
    --rh-cy     传阅·姓名行 与 传阅·日期行（两行保持等高，「传阅」跨行格自动联动）
    --rh-jieguo 办理结果
    ※ 当前版面已占 24.3cm / 版心 24.62cm，单页余量约 0.3cm。再加高就会掉到第二页，
      想继续加高需同步压缩其他行（建议优先压 --rh-pishi 领导批示）。

  【尺寸锁定机制】
  1) table-layout:fixed + <colgroup> 百分比列宽
     → 列宽只由表格总宽决定，任何内容都不可能撑宽某一列。
  2) 每个单元格内是 <div class="c">，高度取 --rh（行高变量），overflow:hidden
     → 文字再多也不会把行高顶开；超出部分被裁剪，表格外形恒定。
  3) 想整体缩放：只改 --table-w 和 --table-shift 两个变量即可，列比例不变。
     · 按原样（溢出页边距）: --table-w:16.906875cm; --table-shift:-1.128cm;
     · 收进版心内        : --table-w:14.650861cm; --table-shift:0;

  【三个自动适配】（超出不会撑开表格，而是自动压缩内容）
    · paras   拟办意见：按 \n 拆段，**每段都缩进 2 个汉字**
    · autofit 来文字号、收文编号等窄格：内容过长时自动缩小字号（14pt → 最小 8pt）
    · fitlines 文件标题：行数过多时自动压缩行距（1.2 → 0.95）
    这三个是 class，给任意单元格加上即生效。

  【填充数据】在页面里调用 fillForm({...})，键名见每个单元格的 data-field：
    fillForm({
      laiwenDanwei:'西安市卫生健康委员会',
      laiwenZihao:'市卫发〔2026〕15号',
      shouwenRiqi:'2026年9月15日',
      laiwenLeixing:'请示',
      shouwenTujing:'机要交换',
      jinjiChengdu:'特急',
      miJi:'秘密',
      shouwenBianhao:'雁卫收〔2026〕128号',
      wenjianBiaoti:'关于报送2026年第三季度工作进展情况的通知',
      lingdaoPishi:'请××同志阅处。\n同意拟办意见，请××科牵头落实。',
      niBanYijian:'拟请××科会同××科办理，于9月30日前反馈。',
      chuanYueNames:['张××','李××','王××','赵××','孙××','周××'],
      chuanYueDates:['9.16','9.16','9.17','9.17','9.18','9.18'],
      banliJieguo:'已办结，材料已归档。'
    });
  ============================================================================
-->
<style>
  :root{
    /* ---------- 页面 ---------- */
    --page-w      : 21cm;
    --page-h      : 29.7cm;
    --mg-tb       : 2.54cm;   /* 上下页边距 1440 twips */
    --mg-lr       : 2cm;        /* 左右页边距（收窄以容纳表格宽度） */

    /* ---------- 表格 ---------- */
    --table-w     : 16.906875cm;  /* docx tblW = 9585 dxa */
    --table-shift : -1.128cm;     /* (版心宽 14.650861 - 表格宽) / 2 */

    /* ---------- 视觉 ---------- */
    --line        : #FF0000;      /* 表格线/标题/标签色 */
    --ink         : #000000;      /* 填写内容色 */
    --f-title     : "方正小标宋简体","FZXiaoBiaoSong-B05S","FZXiaoBiaoSong-B05","STZhongsong","华文中宋","SimSun",serif;
    --f-body      : "仿宋_GB2312","FangSong_GB2312","FangSong","仿宋","STFangsong","SimSun",serif;
    --fs-title    : 22pt;
    --fs-body     : 14pt;

    /* ---------- 行高：全部集中在这里，改这一个地方即可 ---------- */
    --rh          : 1.15cm;       /* 前 4 行：来文单位 / 来文字号 / 来文类型 / 紧急程度 */
    --rh-biaoti   : 2.2296cm;     /* 文件标题   docx trHeight 1264 */
    --rh-pishi    : 4.6461cm;     /* 领导批示   docx trHeight 2634 */
    --rh-niban    : 5.7cm;        /* 拟办意见   docx trHeight 2950 → 原 5.2035cm，已加高 */
    --rh-cy       : 1.1695cm;     /* 传阅·姓名行 与 传阅·日期行（两行等高，docx 663） */
    --rh-jieguo   : 2.3495cm;     /* 办理结果   docx trHeight 1332 */
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:#5a5a5a;
    font-family:var(--f-body);
    font-size:var(--fs-body);
  }

  /* 纸张 */
  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:var(--page-w);
    min-height:var(--page-h);
    margin:0 auto;
    padding:var(--mg-tb) var(--mg-lr);
    background:#fff;
    color:var(--ink);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  /* 标题：方正小标宋简体 22pt 红色居中 */
  .doc-title{
    width:100%;
    margin:0 0 13pt 0;                 /* 13pt = docx 中紧随的空行 spacing line=260 exact */
    font-family:var(--f-title);
    font-size:var(--fs-title);
    line-height:1.2;
    font-weight:normal;
    color:var(--line);
    text-align:center;
    letter-spacing:0;
  }

  /* ============ 表格：尺寸全锁定 ============ */
  table.piban{
    table-layout:fixed;                /* ① 列宽由 colgroup 决定，内容无权改变 */
    width:var(--table-w);
    margin:0 auto;                     /* 居中（自动计算左右边距，含负值溢出） */
    border-collapse:collapse;
    border-spacing:0;
    color:var(--ink);
    font-family:var(--f-body);
    font-size:var(--fs-body);
    line-height:1.2;
  }
  table.piban col{ /* 列宽百分比 = 各 gridCol / 9585 */ }
  table.piban td{
    height:var(--rh);
    padding:0;
    border:1pt solid var(--line);      /* tblBorders sz=8 → 1pt */
    vertical-align:top;
    overflow:hidden;
  }
  /* 单元格内容容器：高度写死 + 裁剪，保证行高不被撑开 */
  table.piban td > .c{
    display:flex;
    flex-direction:column;
    justify-content:center;            /* docx vAlign=center */
    height:var(--rh);
    min-height:0;
    padding:0 0.19cm;                  /* tblCellMar left/right = 108 dxa */
    overflow:hidden;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:pre-wrap;
  }
  /* 所有填写内容默认垂直居中（与 docx 的 vAlign=center 一致）。
     若某个单元格想改回顶对齐，给它加 top 类即可。 */
  table.piban td > .c.top{ justify-content:flex-start; }
  table.piban td > .c.ind{ text-indent:0.988cm; }          /* 首行缩进 2 字符 = 560 dxa */
  table.piban td > .c.lh-dbl{ line-height:28pt; }          /* 拟办意见：docx spacing line=560 exact = 28pt 固定行距 */

  /* 多段落：每一段都缩进 2 个汉字（fillForm 会按 \n 拆成 .pi） */
  table.piban td > .c.paras .pi{ text-indent:0.988cm; }

  /* 标签文字（左侧栏）：红色 14pt 仿宋 */
  .lbl{
    color:var(--line);
    text-align:center;
    text-indent:0 !important;
  }
  /* 填写内容 */
  .val{ color:var(--ink); text-align:left; }
  .ctr{ text-align:center; }

  /* 表尾备注：强制单行，不换行 */
  .note{
    width:100%;
    margin:0.45cm 0 0 0;
    font-family:var(--f-body);
    font-size:var(--fs-body);
    line-height:1.2;
    color:var(--line);
    white-space:nowrap;
    letter-spacing:0;
    text-align:center;
  }

  /* ---------- 打印 ---------- */
  @page{ size:A4; margin:0; }
  @media print{
    html,body{ background:#fff; }
    .page{ margin:0; padding:var(--mg-tb) var(--mg-lr); width:var(--page-w); min-height:var(--page-h); box-shadow:none; }
  }
</style>
</head>
<body>

<div class="page">

  <p class="doc-title">西安市雁塔区卫生健康局文件批办单</p>

  <table class="piban">
    <colgroup>
      <col style="width:8.3777%" />
      <col style="width:8.9202%" />
      <col style="width:12.9890%" />
      <col style="width:0.7929%" />
      <col style="width:11.8832%" />
      <col style="width:1.8988%" />

<script>
/* ---------------------------------------------------------------------------
   示例数据：仅用于预览填充效果，接入业务时删掉即可。
   在浏览器地址栏加 ?demo=1 打开本文件即可看到填充后的样子。
   --------------------------------------------------------------------------- */
var SAMPLE_DATA = {
  laiwenDanwei : '西安市卫生健康委员会',
  laiwenZihao  : '市卫疾控发〔2026〕128号',
  shouwenRiqi  : '2026年9月15日',
  laiwenLeixing: '通知',
  shouwenTujing: '机要交换',
  jinjiChengdu : '平件',
  miJi         : '内部',
  shouwenBianhao:'雁卫收〔2026〕328号',
  wenjianBiaoti: '关于开展2026年秋季全区重点人群流感疫苗接种工作的通知及实施方案',
  lingdaoPishi : '请王××同志阅处。\n拟同意，请疾控科牵头、医政科配合，于9月25日前报送接种进度。\n\n                                      李××   9月16日',
  niBanYijian  : '拟请疾控科会同医政科抓好落实，各社区卫生服务中心同步做好宣传动员，于9月25日前将接种台账及工作总结报局办公室。\n请财务科做好疫苗采购经费保障，宣教科同步做好政策解读与舆情监测。',
  chuanYueNames: ['王××','李××','张××','刘××','陈××','杨××'],
  chuanYueDates: ['9.16','9.16','9.17','9.17','9.18','9.18'],
  banliJieguo  : '已按领导批示办理完毕，接种台账、进度表及工作总结均已报局办公室归档。'
};

/* ---------------------------------------------------------------------------
   自动适配工具
     autofit  : 内容过长时自动缩小字号（14pt → 最小 8pt，步长 0.5pt）
     fitlines : 内容行数过多时自动压缩行距（1.2 → 0.95）
     paras    : 按 \n 拆成多段，每段都缩进 2 个汉字
   --------------------------------------------------------------------------- */
var _meas = null;
function _measNode(){
  if(!_meas){
    _meas = document.createElement('span');
    _meas.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;';
    document.body.appendChild(_meas);
  }
  return _meas;
}
function _textWidth(el, fsPt){
  var m = _measNode(), cs = getComputedStyle(el);
  m.style.fontFamily   = cs.fontFamily;
  m.style.fontWeight   = cs.fontWeight;
  m.style.letterSpacing= cs.letterSpacing || 'normal';
  m.style.fontSize     = fsPt + 'pt';
  return m.offsetWidth;
}
function _innerWidth(el){
  var cs = getComputedStyle(el);
  return el.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
}
/* 过长 → 缩小字号 */
function autoFitFont(el){
  var txt = el.textContent.trim();
  if(!txt) return;
  var m = _measNode(), cs = getComputedStyle(el);
  m.style.fontFamily   = cs.fontFamily;
  m.style.fontWeight   = cs.fontWeight;
  m.style.letterSpacing= cs.letterSpacing || 'normal';
  m.textContent = txt;
  var max = _innerWidth(el), fs = 14;
  if(max <= 0){
    /* 单元格宽度还没就绪（CSS 未应用或字体未加载），延迟重试 */
    setTimeout(function(){ autoFitFont(el); }, 100);
    return;
  }
  for(; fs >= 8; fs -= 0.5){
    m.style.fontSize = fs + 'pt';
    if(m.offsetWidth <= max){ el.style.fontSize = fs + 'pt'; return; }
  }
  el.style.fontSize = '8pt';
}
/* 行数过多 → 压缩行距（只在真的放不下时才动） */
function autoFitLine(el){
  var max = el.clientHeight - parseFloat(getComputedStyle(el).paddingTop || 0)
                            - parseFloat(getComputedStyle(el).paddingBottom || 0);
  /* 测量期间临时改顶对齐：居中时内容向上溢出，scrollHeight 会测不准 */
  var oldJustify = el.style.justifyContent;
  el.style.justifyContent = 'flex-start';
  for(var lh = 1.2; lh >= 0.95; lh -= 0.05){
    el.style.lineHeight = lh;
    if(el.scrollHeight <= max + 0.5) break;
  }
  el.style.justifyContent = oldJustify;
}

/* 写入单个单元格 */
function setCell(el, v){
  v = (v == null) ? '' : String(v);
  el.style.fontSize = '';
  el.style.lineHeight = '';
  if(el.classList.contains('paras')){
    el.innerHTML = '';
    v.split(/\r?\n/).forEach(function(line){
      if(!line) return;
      var d = document.createElement('div');
      d.className = 'pi';
      d.textContent = line;
      el.appendChild(d);
    });
  }else{
    el.textContent = v;
  }
  if(v){
    if(el.classList.contains('autofit'))  autoFitFont(el);
    if(el.classList.contains('fitlines')) autoFitLine(el);
  }
}

/* ---------------------------------------------------------------------------
   填充数据。data 中的键与各单元格的 data-field 对应。
   chuanYueNames / chuanYueDates 传数组（最多 6 个）。
   超长文本不会撑开表格：单元格高度与列宽都是锁死的，超出部分被裁剪，
   而是自动缩小字号 / 压缩行距来容纳。
   --------------------------------------------------------------------------- */
function fillForm(data){
  if(!data) return;
  Object.keys(data).forEach(function(k){
    var v = data[k];
    if(Array.isArray(v)){
      v.forEach(function(item, i){
        var el = document.querySelector('[data-field="'+k+'['+i+']"]');
        if(el) setCell(el, item);
      });
    }else{
      var el = document.querySelector('[data-field="'+k+'"]');
      if(el) setCell(el, v == null ? '' : v);
    }
  });
}

/* 清空所有填写内容，恢复空白模板 */
function clearForm(){
  document.querySelectorAll('[data-field]').forEach(function(el){ setCell(el, ''); });
}

/* 打印前：将 JS 设的 inline font-size/line-height 转为 CSS 规则
   （浏览器打印会丢弃 inline style，但保留 <style> 标签中的规则） */
window.addEventListener('beforeprint', function(){
  var rules = '';
  document.querySelectorAll('[data-field]').forEach(function(el){
    var f = el.getAttribute('data-field');
    if(el.style.fontSize) rules += '[data-field="'+f+'"]{font-size:'+el.style.fontSize+'!important}';
    if(el.style.lineHeight) rules += '[data-field="'+f+'"]{line-height:'+el.style.lineHeight+'!important}';
  });
  var s = document.getElementById('print-autofit') || document.createElement('style');
  s.id = 'print-autofit';
  s.textContent = rules;
  if(!s.parentNode) document.head.appendChild(s);
});
window.addEventListener('afterprint', function(){
  var s = document.getElementById('print-autofit');
  if(s) s.textContent = '';
});

/* 地址栏带 ?demo=1 时自动填入示例数据 */
if(/(\?|&)demo\b/.test(location.search)){
  /* 等 DOM + 字体就绪再填充，避免测量宽度时拿到 0 */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ fillForm(SAMPLE_DATA); });
  }else{
    setTimeout(function(){ fillForm(SAMPLE_DATA); }, 200);
  }
}
</script>
